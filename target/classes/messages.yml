EN:
  prefix: "<gray>[<gradient:#FF5555:#FFAAAA>FastShooter</gradient>]</gray> "
  msg_queue_join: "%shooter% <green>You have joined the tournament queue!</green>"
  msg_queue_leave: "%shooter% <yellow>You have left the tournament.</yellow>"
  already_in_queue: "%shooter% <red>You are already in the tournament!</red>"
  not_in_queue: "%shooter% <red>You are not in the tournament!</red>"
  no_console: "%shooter% <red>Only players can execute this command.</red>"
  no_permission: "%shooter% <red>You do not have permission to do this!</red>"
  tournament_already_started: "%shooter% <red>A tournament is already in progress!</red>"
  tournament_closed: "%shooter% <red>The tournament queue is currently closed!</red>"
  tournament_already_open: "%shooter% <red>The tournament is already open!</red>"
  not_enough_players: "%shooter% <red>Not enough eligible players in the queue to start a tournament (minimum 2)!</red>"
  msg_not_enough_locations: "%shooter% <red>Setup is incomplete. Please set pos1, pos2, shoot1, and shoot2 first!</red>"
  
  setup_success: "%shooter% <green>Successfully set location for %location_id%!</green>"
  
  queue_opened: "%shooter% <green>The FastShooter tournament is now OPEN! Type /shooter join to enter!</green>"
  queue_closed: "%shooter% <red>The tournament queue has been CLOSED!</red>"
  tournament_started: "%shooter% <green>The Tournament has begun! Advancing players to the crowd.</green>"
  tournament_stopped: "%shooter% <red>The Tournament was forcefully stopped.</red>"
  
  round_started: "%shooter% <gold>Starting %round_name%!</gold>"
  duel_announcement: "%shooter% <yellow>Next Duel: <gold>%player1%</gold> <yellow>vs</yellow> <gold>%player2%</gold></yellow>"
  bye_announcement: "%shooter% <gold>%player%</gold> <yellow>receives a Bye and advances to the next round automatically.</yellow>"
  
  countdown_title: "<color:#FFA500>%time%</color>"
  go_title: "<green><bold>GO!</bold></green>"
  countdown_subtitle: "<gray>Get ready to jump! (Don't jump early)</gray>"
  
  bossbar_title: "<red>Ammo: %ammo%</red>"
  ammo_symbol: "●"
  
  win_title: "<gradient:#FFD700:#FFA500>VICTORY!</gradient>"
  win_subtitle: "<white>%winner% won in %time%ms!</white>"
  lose_title: "<red>ELIMINATED</red>"
  lose_subtitle: "<gray>Too slow!</gray>"
  false_start_lose_title: "<dark_red>FALSE START</dark_red>"
  false_start_lose_subtitle: "<red>You jumped early and ran out of ammo!</red>"
  msg_draw: "%shooter% <red>No one fired in time! It's a draw.</red>"
  
  msg_winner_broadcast: "%shooter% <gold>%winner%</gold> <yellow>eliminated</yellow> <gold>%loser%</gold><yellow>!</yellow>"
  msg_final_winner_title: "<gradient:#FFD700:#FFA500>★ %winner% IS THE TOURNAMENT CHAMPION! ★</gradient>"
  
  duel_cancelled: "%shooter% <red>The duel was cancelled due to a player disconnecting or an error.</red>"
  
  reload_success: "%shooter% <green>Configuration and messages reloaded successfully!</green>"
  tournament_running_noreload: "%shooter% <red>Cannot reload while a tournament is running! Stop it first.</red>"
  
  expansion_not_running: "<red>Not Running</red>"
  expansion_na: "N/A"
  expansion_none: "None"
  expansion_unknown: "Unknown"
